<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="data:,"><title>🛶 Venice Walking Tour</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><main class="container"><header class="tour-hero"><h1>🛶 Venice Walking Tour</h1><p class="subtitle">18 stops · Sunday, July 26</p><div class="stats"><div class="stat">18 stops</div><div class="stat">Afternoon to blue hour</div><div class="stat">Walk + vaporetto</div></div><a class="top-link" href="index.html">← Back to trip</a></header><div class="route-note" id="routeNote"></div><div id="map" class="map"></div><section id="stopList"></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>window.TRIP_CONFIG={"supabaseUrl":"https://xsfvzedpkiqgipnftdxb.supabase.co","supabaseAnon":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzZnZ6ZWRwa2lxZ2lwbmZ0ZHhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTYyMTMsImV4cCI6MjA4NzM3MjIxM30.mytDq_kTTFTdZsT8OJYL9Zviz3JMN0HuqqKX1W-IhPM","family":[{"id":"calvin","emoji":"👨","name":"Calvin"},{"id":"karissa","emoji":"👩","name":"Karissa"},{"id":"christian","emoji":"👦","name":"Christian"},{"id":"tori","emoji":"👧","name":"Tori"}]};window.TOUR_STOPS=[["Hotel Palazzo Priuli","11:30 AM · settle in",45.4363,12.3439,"Hotel Palazzo Priuli is a historic Castello hotel near small canals and quiet lanes. It gives the family a calm base close to San Marco without sleeping on the loudest square. Address: Fondamenta de l'Osmarin 4979/b, Castello, 30122 Venezia VE, Italy.","Drop bags, freshen up, and treat this as the anchor point for the rest of the afternoon.","Christian: Venice works like a maze because streets grew around water, not cars.","Tori: Pick a landmark near the hotel so you can find it again.","Booking #6231598372"],["Osteria al Portego","12:00 PM · lunch",45.4369,12.3401,"Osteria al Portego is a practical Castello lunch stop before entering the San Marco crowds. It keeps the family close to the hotel and close enough to the afternoon ticket path. Address: Calle de la Malvasia, 6014, 30122 Venezia VE, Italy.","Keep lunch simple and shaded; plan to finish around 12:40 PM for the walk toward San Marco.","Christian: This is a tactical meal stop, not a detour, because Venice walking time adds up fast.","Tori: Choose something that will not slow you down before the palace.","Pay as you go"],["Riva degli Schiavoni Walk","12:40 PM · waterfront walk",45.4339,12.344,"Walk from lunch to San Marco via Riva degli Schiavoni, Venice's broad waterfront promenade facing the lagoon. Address: Riva degli Schiavoni, 30122 Venezia VE, Italy.","Use the waterfront route for easier navigation and a first open-lagoon view before the San Marco cluster.","Christian: This waterfront was Venice showing arrivals its power from the sea.","Tori: Watch for boats that look like buses, taxis, and delivery trucks.","Free"],["Bridge of Sighs","1:00 PM · exterior photo",45.4341,12.3409,"The Bridge of Sighs connected the Doge's Palace courts to the prison. The name comes from the idea that prisoners sighed at their last view of Venice. Address: Ponte della Paglia, 30122 Venezia VE, Italy.","The best exterior view is from Ponte della Paglia, looking back at the enclosed white bridge.","Christian: It is a beautiful bridge with a grim job, which is very Venice.","Tori: Make your most dramatic prisoner sigh for the photo.","Free exterior"],["St. Mark's Basilica","1:15 PM · standby line",45.4345,12.3397,"St. Mark's Basilica is Venice's glittering church, built to show the city's wealth and connections with Byzantium. The free standby plan assumes roughly 90 minutes including time inside. Address: Piazza San Marco, 328, 30124 Venezia VE, Italy.","Knees and shoulders covered; no flip-flops. Look up for gold mosaics and down for patterned marble floors that ripple slightly.","Christian: The church was also a trophy case for a trading empire.","Tori: Find as many winged lions as you can before leaving.","Free standby · dress code"],["Doge's Palace Entrance","2:45 PM · cross Piazza San Marco",45.4338,12.34,"Cross Piazza San Marco to the Doge's Palace entrance and get set for the 3:00 PM ticket. Address: Piazza San Marco, 1, 30124 Venezia VE, Italy.","Use this buffer for bathrooms, water, and getting the ticket ready before the palace entry.","Christian: The square is the handoff from Venice as a church city to Venice as a government machine.","Tori: Pick the fastest path through the people without losing the family.","Transition stop"],["Doge's Palace","3:00 PM · confirmed ticket",45.4338,12.34,"The Doge's Palace was Venice's government headquarters, courthouse, and ceremonial showpiece. Its pink-and-white Gothic exterior looks delicate, but the republic inside was powerful and disciplined. Address: Piazza San Marco, 1, 30124 Venezia VE, Italy.","Plan about 90 minutes at kid pace. Find the Giant's Staircase, the huge council rooms, and the prison route if energy allows.","Christian: Venice was a republic with spies, trade routes, and serious political machinery.","Tori: Look for winged lions, the symbol of St. Mark and Venice.","Vivaticket TLITE0139060893317 · 3:00 PM entry"],["Correr Museum Walk","4:35 PM · short walk",45.4343,12.3385,"Take the short walk across Piazza San Marco to the Correr Museum in the Napoleonic Wing. Address: Piazza San Marco, 52, 30124 Venezia VE, Italy.","Keep the transition light so the family is ready for the 4:50 PM museum entry.","Christian: This is a tiny walk across a square that Napoleon redesigned after Venice fell.","Tori: Compare the palace side of the square with the museum side.","Transition stop"],["Correr Museum","4:50 PM · confirmed ticket",45.4343,12.3385,"Correr Museum sits on Piazza San Marco in the Napoleonic Wing and gives the family a calmer Venice-history stop immediately after Doge's Palace. Address: Piazza San Marco, 52, 30124 Venezia VE, Italy.","Keep this to about 40 minutes at a light pace so the Campanile ticket window stays easy.","Christian: This is the other half of the political story: art, maps, weapons, and civic memory.","Tori: Find a fancy room and decide which ceiling wins.","Vivaticket TLITE0139060900403 · 4:50 PM entry"],["Campanile / Bell Tower","5:30 PM · confirmed window",45.434,12.339,"The Campanile is the tall bell tower of St. Mark's Square, rebuilt after it collapsed in 1902. The elevator makes it the easiest big view in Venice at the confirmed late-afternoon window. Address: Piazza San Marco, 30124 Venezia VE, Italy.","Use the 5:30-6:00 PM window. From the top, notice there are almost no cars or roads, just roofs, canals, and lagoon.","Christian: This view explains why Venice became a sea power.","Tori: Try to spot a boat that looks tiny from above.","Booking 171-1ZDBCL9 · SPYE3E39KW74 · 5:30 PM window"],["Mercerie Walk","6:15 PM · toward Rialto",45.4356,12.3375,"Walk the Mercerie, Venice's classic shopping lanes, from San Marco toward Rialto. Address: Merceria dell'Orologio, 30124 Venezia VE, Italy.","This is the post-ticket decompression stretch: windows, lanes, and no museum clock pressure.","Christian: These lanes show how Venice turned foot traffic into commerce.","Tori: Pick the best window display on the way to the bridge.","Free"],["Rialto Bridge","6:40 PM · Grand Canal view",45.438,12.3359,"Rialto Bridge was the main crossing of the Grand Canal for centuries and still feels like Venice's busy hinge. Address: Ponte di Rialto, 30125 Venezia VE, Italy.","Stand at the center for the classic Grand Canal view with boats moving both ways.","Christian: A bridge with shops means every step could also make money.","Tori: Count gondolas from the top before the family moves on.","Free"],["Vaporetto Line 1 to Salute","7:00 PM · golden hour ride",45.4376,12.3365,"Board Vaporetto Line 1 at the Rialto \"C\" stop for the golden-hour ride toward Salute. Address: Rialto \"C\" Vaporetto Stop, 30125 Venezia VE, Italy.","Ride outside if space allows and keep cameras ready for palaces along the Grand Canal.","Christian: This is public transit, but the route is basically a floating architecture tour.","Tori: Choose your favorite palace as the boat passes.","Vaporetto ticket"],["Santa Maria della Salute","7:20 PM · exterior photos",45.4307,12.334,"Santa Maria della Salute was built after a plague, thanking Mary for the city's survival. Address: Dorsoduro, 1, 30123 Venezia VE, Italy.","From the steps, look back toward San Marco across the water.","Christian: This church is a public memory of a disaster and a recovery.","Tori: Find the giant dome and decide if it looks like a crown or a cupcake.","Exterior stop"],["Accademia Bridge","7:40 PM · sunset view",45.4318,12.3288,"The Accademia Bridge gives one of the best sunset views in Venice, looking down the Grand Canal toward Salute. It is wood, simple, and all about the view. Address: Ponte dell'Accademia, 30123 Venezia VE, Italy.","Face east for the postcard angle with Salute at the end of the canal.","Christian: This is the shot that explains Venice in one frame.","Tori: Pick the prettiest boat passing under the bridge.","Free"],["Osteria Al Squero","8:00 PM · dinner",45.4295,12.3268,"Osteria Al Squero is a practical Dorsoduro dinner target after the Accademia sunset view, with calmer lanes than San Marco and easy wandering nearby. Address: Fondamenta Nani, 943-944, 30123 Venezia VE, Italy.","Plan about 90 minutes. Look across toward the squero, the traditional gondola workshop, if you arrive before it is too dark.","Christian: Dinner here is tactical: quieter lanes, better breathing room, less crowd crush.","Tori: Choose tonight's gelato color before dessert.","Pay as you go"],["Bacino Orseolo Gondola","9:30 PM · 30 min",45.4348,12.337,"Bacino Orseolo is a tucked-away gondola basin just behind San Marco. At blue hour, the water reflects lights and the route feels quieter than midday. Address: Bacino Orseolo, 30124 Venezia VE, Italy.","Watch how the gondolier steers with one oar from the stern.","Christian: The gondola is asymmetrical on purpose, so it tracks straight with one rower.","Tori: Listen for the water sounds when the canals get narrow.","Gondola ride"],["Hotel Palazzo Priuli Return","10:15 PM · walk back",45.4363,12.3439,"Return to Hotel Palazzo Priuli through quiet San Marco and Castello lanes. Address: Fondamenta de l'Osmarin 4979/b, Castello, 30122 Venezia VE, Italy.","Keep the final walk simple and direct; this is the end of the long Venice arrival day.","Christian: Night Venice is easier to read by landmarks than by street names.","Tori: Listen for how quiet the city gets without cars.","Hotel #6231598372"]];window.TOUR_KIND='venice';</script><script src="tour-shared.js"></script><script src="venice.js"></script></body></html>
